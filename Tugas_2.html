<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tugas 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <form action="#">
         <fieldset>

            <h1>Join Our Community!</h1>
        Username <br> <br>
        <input type="text" name="User"> <br><br>
        <label for="Sandi">
            Password
        </label> <br> <br>
        <input type="password" name="Sandi" id="Sandi"><br><br>
        <label for="Tgllahir"> Tanggal Lahir</label> <br> <br>
        <input type="date" name="Tgllahir" id="Tgllahir" /><br /><br/>
        
        <label for="umur">Umur</label> <br> <br>
        <input type="number" name="umur" id="umur" min="17" max="100" /><br/> <br>
        <label for="prodi">Program Studi</label><br /> <br>
        <select name="prodi" id="prodi">
            <option value="Manajemen">Manajemen</option>
            <option value="Teknologi informasi">Teknologi Informasi</option>
            <option value="Ilmu Komputer">Ilmu Komputer</option>
            <option value="Sastra Jepang">Sastra Jepang</option>
            <option value="Teknik Mesin">Teknik Mesin</option>
        </select>
        
       <br> <br>
           
        <label for="Jenis Kelamin">Jenis Kelamin</label><br> <br>
        <input type="radio" id="Perempuan" name="gender" value="Perempuan">
        <label for="Perempuan">Perempuan</label><br>
        <input type="radio" id="Laki-laki" name="gender" value="Laki-laki">
        <label for="Laki-laki">Laki-laki</label><br> <br>

        <label for="Minat & Bakat">Minat dan Bakat </label> <br> <br>
        <input type="checkbox" id="Desain" name="hobi" value="Desain>
        <label for="Desain">Desain</label> <br>
        <input type="checkbox" id="Musik" name="hobi" value="Musik>
        <label for="Musik">Musik</label> <br>
        <input type="checkbox" id="Pemrograman" name="hobi" value="Pemrograman">
        <label for="Pemrograman">Pemrograman</label> <br>
        <input type="checkbox" id="Traveling" name="hobi" value="Traveling">
        <label for="Traveling">Traveling</label> <br> <br>

        <label for="alamat">Alamat Rumah</label>  <br> <br>
        <textarea name="alamat" id="alamat" cols="20" rows="4"></textarea>
        <br> <br>

        <button type="submit" name="=btnDaftar">Daftar</button>
        <input type="reset" value="Hapus semua data" name="=btnReset"><br>

        </fieldset>
        
    </form>
</body>
</html>
